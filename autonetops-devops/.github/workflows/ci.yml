name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autonetops-devops/docker/requirements.txt

      - name: Run validation
        run: |
          python -m compileall autonetops-devops/docker/src

      - name: Build Docker image
        run: |
          docker build -t autonetops/backend:ci autonetops-devops/docker

name: Publish image
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: autonetops-devops/docker
          file: autonetops-devops/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autonetops-backend:latest
            ghcr.io/${{ github.repository_owner }}/autonetops-backend:${{ github.sha }}

version: "3.9"

services:
  app:
    container_name: ${COMPOSE_PROJECT_NAME:-autonetops}-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-autonetops/app:local}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "${APP_PORT:-8000}"
      DATASTORE_URL: "${DATASTORE_URL:-sqlite:////app/data/db.sqlite3}"
    volumes:
      - autonetops_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/health'); sys.exit(0 if r.status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  autonetops_data:
